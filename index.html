    <!-- Pré-configuration de Google Analytics (Consent Mode v2).
         Le tag GA est injecté par Netlify (snippet injection), donc en fin de
         <head> ou de <body> : ce script s'exécute forcément avant lui, et les
         commandes empilées ici sont consommées par gtag à son initialisation.
         Le consentement doit impérativement être déclaré avant le premier
         'config', sans quoi ad_storage vaut « granted » par défaut.

         On refuse le stockage publicitaire, ce qui supprime les appels vers
         stats.g.doubleclick.net et google.<tld>/ads/ga-audiences, bloqués par la
         CSP à la première visite de chaque navigateur. Ces appels servent au
         remarketing, pas à la mesure d'audience.

         analytics_storage reste accordé : le comptage des vues continue de
         remonter dans GA, en parallèle d'Umami. -->
    <script>
        window.dataLayer = window.dataLayer || []
        function gtag() { dataLayer.push(arguments) }
        gtag('consent', 'default', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: 'granted'
        })
    </script>

<body style="background-color: #000000">
    <!-- Formulaire statique de détection Netlify.
         Netlify analyse le HTML *déployé* au moment du build pour enregistrer
         les formulaires et leurs champs. Le vrai formulaire étant rendu par
         React à l'exécution, Netlify ne le voit jamais : cette copie inerte est
         ce qui déclare le formulaire « contact », ses champs, le honeypot et
         l'exigence de reCAPTCHA côté serveur. Elle n'est ni affichée ni soumise.
         Ses champs doivent rester alignés sur ceux de Contact.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" data-netlify-recaptcha="true" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input name="bot-field" />
        <!-- Ce div — et non l'attribut porté par <form> — est ce qui déclare à
             Netlify que « contact » exige un reCAPTCHA valide. Sans lui, Netlify
             accepte les soumissions sans jamais appeler siteverify : le jeton
             produit par le widget n'est alors vérifié par personne, ce que la
             console Google signale comme un reCAPTCHA non vérifié.
             Le formulaire étant `hidden`, aucun widget n'est rendu ici ; celui
             qui compte reste le widget invisible monté par Contact.jsx. -->
        <div data-netlify-recaptcha="true"></div>
    </form>
